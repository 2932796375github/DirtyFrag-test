name: Build DirtyFrag Universal (source)

on:
  schedule:
    - cron: '0 17 */2 * *'   # every 2 days
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'dirtyfrag-lkm/**'
      - '.github/workflows/build.yml'

env:
  DDK_RELEASE: '20260828'
  KMIS: 'android12-5.10 android13-5.10 android13-5.15 android14-5.15 android15-6.6 android16-6.12 android17-6.18'

jobs:
  ksud:
    name: Build ksud (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          fetch-depth: 0
      - name: Setup rustup
        run: |
          rustup update stable
          rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/ksud
          cache-targets: false
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
      - name: Build ksud
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          source .github/scripts/setup-rust-build.sh aarch64-linux-android 26
          cargo build --target aarch64-linux-android --release --manifest-path ./userspace/ksud/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: ksu-daemon
          path: target/aarch64-linux-android/release/ksud

  kernelsu-ko:
    name: Build kernelsu.ko (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: [android12-5.10, android13-5.10, android13-5.15, android14-5.15, android15-6.6, android16-6.12, android17-6.18]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ vars.DDK_RELEASE || '20260828' }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tiann/KernelSU
          fetch-depth: 0
      - name: git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build kernelsu.ko (default signature = official manager)
        run: |
          cd kernel
          echo "KDIR=${KDIR:-<unset>}"
          CONFIG_KSU=m CC=clang make
          llvm-strip -d kernelsu.ko
          cp kernelsu.ko ../kernelsu-${{ matrix.kmi }}.ko
      - uses: actions/upload-artifact@v4
        with:
          name: kernelsu-${{ matrix.kmi }}
          path: kernelsu-${{ matrix.kmi }}.ko

  dirtyfrag-ko:
    name: Build dirtyfrag.ko (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: [android12-5.10, android13-5.10, android13-5.15, android14-5.15, android15-6.6, android16-6.12, android17-6.18]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ vars.DDK_RELEASE || '20260828' }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build dirtyfrag.ko
        run: |
          cd dirtyfrag-lkm
          echo "KDIR=${KDIR:-<unset>}"
          make
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data \
            dirtyfrag.ko 2>/dev/null || true
          cp dirtyfrag.ko ../dirtyfrag-${{ matrix.kmi }}.ko
      - uses: actions/upload-artifact@v4
        with:
          name: dirtyfrag-${{ matrix.kmi }}
          path: dirtyfrag-${{ matrix.kmi }}.ko

  pack-apk:
    name: Pack DirtyFrag Universal APK
    runs-on: ubuntu-latest
    needs: [kernelsu-ko, dirtyfrag-ko]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dirtyfrag-*
          path: ko-stage
      - uses: actions/download-artifact@v4
        with:
          pattern: kernelsu-*
          path: ksu-ko-stage
      - uses: actions/download-artifact@v4
        with:
          name: ksu-daemon
          path: daemon-stage
      - name: Place dirtyfrag KO blobs
        run: |
          for d in ko-stage/dirtyfrag-*; do
            kmi=${d#ko-stage/dirtyfrag-}
            cp "$d/dirtyfrag-$kmi.ko" "app/src/main/jni/ko/dirtyfrag-$kmi.ko"
          done
          ls -la app/src/main/jni/ko/
      - name: Place paired KSU assets
        run: |
          for kmi in android12-5.10 android13-5.10 android13-5.15 android14-5.15 android15-6.6 android16-6.12 android17-6.18; do
            cp "ksu-ko-stage/kernelsu-$kmi/kernelsu-$kmi.ko" "app/src/main/assets/kernelsu-$kmi.ko"
          done
          cp daemon-stage/ksud app/src/main/assets/ksu-daemon
          ls -la app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build + sign APK
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KS_PASS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          # the app's signingConfig 'keystore' expects app/keystore.jks with
          # the hardcoded dirtyfrag/dirtyfrag credentials (public by design)
          echo "$KEYSTORE_B64" | base64 -d > app/keystore.jks
          ./gradlew :app:assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/dirtyfrag.apk out/DirtyFrag-universal.apk
      - name: Collect outputs
        run: ls -la out/
      - uses: actions/upload-artifact@v4
        with:
          name: DirtyFrag-universal
          path: out/

  nightly:
    name: Publish rolling nightly
    runs-on: ubuntu-latest
    needs: [pack-apk]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DirtyFrag-universal
          path: out/
      - name: Publish rolling nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly out/* \
            --title "nightly $(date +%Y%m%d-%H%M)" \
            --notes "Rolling nightly, built from source. KernelSU Manager (official) must be installed separately; DirtyFrag Universal APK embeds the paired kernelsu.ko set for every supported KMI."
