name: Build DirtyFrag Universal

on:
  workflow_dispatch:
    inputs:
      ksu_run_id:
        description: 'tiann/KernelSU CI run id to source the paired KSU set from (default: latest successful)'
        required: false
      ksu_ref:
        description: 'Optional KernelSU git ref (builds kernelsu.ko + manager from source instead of fetching artifacts)'
        required: false
  repository_dispatch:
    types: [ksu-update]
  push:
    branches: [master]
    paths:
      - 'app/**'
      - 'dirtyfrag-lkm/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

env:
  KMIS: 'android12-5.10 android13-5.10 android13-5.15 android14-5.15 android15-6.6 android16-6.12 android17-6.18'
  DDK_RELEASE: '20260828'

jobs:
  build-dirtyfrag-ko:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: [android12-5.10, android13-5.10, android13-5.15, android14-5.15, android15-6.6, android16-6.12, android17-6.18]
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ vars.DDK_RELEASE || '20260828' }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: git safe.directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build dirtyfrag.ko for ${{ matrix.kmi }}
        run: |
          cd dirtyfrag-lkm
          echo "KDIR=${KDIR:-<unset>}"
          make
          # page-write size diet (upstream build.sh recipe)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data \
            dirtyfrag.ko 2>/dev/null || true
          cp dirtyfrag.ko ../dirtyfrag-${{ matrix.kmi }}.ko
      - uses: actions/upload-artifact@v4
        with:
          name: dirtyfrag-${{ matrix.kmi }}
          path: dirtyfrag-${{ matrix.kmi }}.ko

  fetch-ksu-set:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.fetch.outputs.run_id }}
    steps:
      - id: fetch
      - uses: actions/checkout@v4
      - name: Fetch paired KSU artifact set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/fetch-ksu.sh "${{ inputs.ksu_run_id }}" app/src/main/assets
          echo "run_id=$(cat .ksu-run-id)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ksu-set
          path: |
            app/src/main/assets/
            manager.apk
            .github/ksu-run-id

  pack-apk:
    runs-on: ubuntu-latest
    needs: [build-dirtyfrag-ko, fetch-ksu-set]
    steps:
      - uses: actions/checkout@v4
      - name: Download KO matrix
        uses: actions/download-artifact@v4
        with:
          pattern: dirtyfrag-*
          path: ko-stage
      - name: Place dirtyfrag KO blobs
        run: |
          for d in ko-stage/dirtyfrag-*; do
            kmi=${d#ko-stage/dirtyfrag-}
            cp "$d/dirtyfrag-$kmi.ko" "app/src/main/jni/ko/dirtyfrag-$kmi.ko"
          done
          ls -la app/src/main/jni/ko/
      - name: Download paired KSU set
        uses: actions/download-artifact@v4
        with:
          name: ksu-set
          path: ksu-stage
      - name: Place KSU assets
        run: |
          cp ksu-stage/app/src/main/assets/kernelsu-*.ko app/src/main/assets/ 2>/dev/null || true
          cp ksu-stage/app/src/main/assets/ksu-daemon app/src/main/assets/
          cp ksu-stage/app/src/main/assets/dfsh app/src/main/assets/
          ls -la app/src/main/assets/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build + sign APK
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KS_PASS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            echo "android.injected.signing.store.file=$(pwd)/release.keystore"     >> keystore.properties
            echo "android.injected.signing.store.password=$KS_PASS"               >> keystore.properties
            echo "android.injected.signing.key.alias=dirtyfrag"                   >> keystore.properties
            echo "android.injected.signing.key.password=$KEY_PASS"                >> keystore.properties
          else
            echo "::warning::RELEASE_KEYSTORE_B64 not set - APK will be unsigned (debug-sign locally)"
          fi
          ./gradlew :app:assembleRelease
          mkdir -p out
          if compgen -G "app/build/outputs/apk/release/*-release*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*-release*.apk out/DirtyFrag-universal.apk
          else
            cp app/build/outputs/apk/release/*.apk out/DirtyFrag-universal.apk
          fi
          ls -la out/
      - name: Include paired manager APK
        run: cp ksu-stage/manager.apk out/manager.apk 2>/dev/null || cp ksu-stage/app/src/main/manager.apk out/manager.apk
      - name: sha256
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: DirtyFrag-universal
          path: out/

  nightly:
    runs-on: ubuntu-latest
    needs: [pack-apk, fetch-ksu-set]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: DirtyFrag-universal
          path: out/
      - name: Update pinned run id
        run: |
          echo "${{ needs.fetch-ksu-set.outputs.run_id }}" > .ksu-run-id
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ksu-run-id
          git diff --cached --quiet || git commit -m "ci: pin ksu source run ${{ needs.fetch-ksu-set.outputs.run_id }}"
          git push
      - name: Publish rolling nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
          gh release create nightly out/* --title "nightly $(date +%Y%m%d-%H%M) (ksu run ${{ needs.fetch-ksu-set.outputs.run_id }})" \
            --notes "Rolling nightly. KSU source run: https://github.com/tiann/KernelSU/actions/runs/${{ needs.fetch-ksu-set.outputs.run_id }} — manager + all KMI kernelsu.ko mutually paired; install manager.apk first.""
